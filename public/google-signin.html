<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #1f1f1f;
    }

    .container {
      background: white;
      border-radius: 28px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid #e0e0e0;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .google-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 8px 0;
      color: #1f1f1f;
    }

    p.subtitle {
      font-size: 16px;
      color: #444746;
      margin: 0 0 24px 0;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 24px;
      text-align: left;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
    }

    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background-color 0.2s;
      background: white;
      border: none;
      border-bottom: 1px solid #f0f0f0;
      width: 100%;
      text-align: left;
    }

    .account-item:last-child {
      border-bottom: none;
    }

    .account-item:hover {
      background-color: #f7f9fc;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #357ae8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 14px;
      margin-right: 12px;
      background-size: cover;
      background-position: center;
    }

    .account-info {
      flex: 1;
    }

    .account-name {
      font-size: 14px;
      font-weight: 500;
      color: #1f1f1f;
    }

    .account-email {
      font-size: 12px;
      color: #5f6368;
    }

    .custom-input-container {
      display: none;
      text-align: left;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #444746;
    }

    .form-group input {
      padding: 12px;
      border: 1px solid #747775;
      border-radius: 4px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #0b57d0;
      border-width: 2px;
      padding: 11px; /* adjust for border width */
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-text {
      background: none;
      border: none;
      color: #0b57d0;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .btn-text:hover {
      text-decoration: underline;
    }

    .btn-primary {
      background-color: #0b57d0;
      color: white;
      border: none;
      border-radius: 100px;
      padding: 10px 24px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #0842a0;
    }

    /* Loading Spinner Overlay */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0b57d0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #444746;
    }

    .footer {
      font-size: 12px;
      color: #5f6368;
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Connecting to Artisan Marketplace...</div>
    </div>

    <!-- Google Logo SVG -->
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>

    <!-- Main Select Screen -->
    <div id="select-screen">
      <h1>Sign in with Google</h1>
      <p class="subtitle">to continue to Artisan Marketplace</p>

      <div class="account-list">
        <button class="account-item" onclick="selectAccount('Nikhil Soni', 'nikhilsoni1030@gmail.com', 'google-1', 'https://i.pravatar.cc/150?img=33')">
          <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?img=33')"></div>
          <div class="account-info">
            <div class="account-name">Nikhil Soni</div>
            <div class="account-email">nikhilsoni1030@gmail.com</div>
          </div>
        </button>
        <button class="account-item" onclick="selectAccount('Jane Smith', 'artisan.jane@gmail.com', 'google-2', 'https://i.pravatar.cc/150?img=47')">
          <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?img=47')"></div>
          <div class="account-info">
            <div class="account-name">Jane Smith</div>
            <div class="account-email">artisan.jane@gmail.com</div>
          </div>
        </button>
        <button class="account-item" onclick="selectAccount('Alex Carter', 'customer.alex@gmail.com', 'google-3', 'https://i.pravatar.cc/150?img=11')">
          <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?img=11')"></div>
          <div class="account-info">
            <div class="account-name">Alex Carter</div>
            <div class="account-email">customer.alex@gmail.com</div>
          </div>
        </button>
        <button class="account-item" onclick="showCustomInput()">
          <div class="avatar" style="background-color: #f1f3f4; color: #5f6368;">+</div>
          <div class="account-info">
            <div class="account-name" style="color: #0b57d0; font-weight: 500;">Use another account</div>
            <div class="account-email">Sign in with a different Google account</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Custom Account Input Screen -->
    <div id="custom-screen" class="custom-input-container">
      <h1 style="margin-bottom: 4px;">Sign in</h1>
      <p class="subtitle" style="margin-bottom: 12px;">Use your Google Account</p>
      
      <div class="form-group">
        <label for="custom-name">Full Name</label>
        <input type="text" id="custom-name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="custom-email">Email Address</label>
        <input type="email" id="custom-email" placeholder="john.doe@gmail.com" required>
      </div>

      <div class="btn-group">
        <button class="btn-text" onclick="showSelectScreen()">Back</button>
        <button class="btn-primary" onclick="submitCustomAccount()">Next</button>
      </div>
    </div>

    <div class="footer">
      <a href="#">English (United States)</a>
      <div style="display:flex; gap:12px;">
        <a href="#">Help</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
    </div>
  </div>

  <script>
    function selectAccount(name, email, googleId, avatar) {
      document.getElementById('loading').style.display = 'flex';
      
      setTimeout(() => {
        const payload = {
          name: name,
          email: email,
          googleId: googleId,
          avatar: avatar
        };
        
        // Post message back to parent window
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_SUCCESS',
            payload: payload
          }, '*');
        }
        
        window.close();
      }, 1200); // realistic spinner delay
    }

    function showCustomInput() {
      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('custom-screen').style.display = 'flex';
      document.getElementById('custom-name').focus();
    }

    function showSelectScreen() {
      document.getElementById('custom-screen').style.display = 'none';
      document.getElementById('select-screen').style.display = 'block';
    }

    function submitCustomAccount() {
      const name = document.getElementById('custom-name').value.trim();
      const email = document.getElementById('custom-email').value.trim();
      
      if (!name || !email) {
        alert('Please fill out all fields');
        return;
      }
      
      if (!email.includes('@')) {
        alert('Please enter a valid email address');
        return;
      }
      
      const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
      const googleId = 'google-' + Math.random().toString(36).substring(2, 11);
      const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=357ae8&color=fff&size=128`;
      
      selectAccount(name, email, googleId, avatar);
    }
  </script>
</body>
</html>
